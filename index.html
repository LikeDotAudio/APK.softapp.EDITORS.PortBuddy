<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port & Terminal Buddy</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    .split-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      height: calc(100vh - 120px);
      padding: 16px;
      overflow: hidden;
    }
    .panel {
      background: var(--surface-primary, #18181b);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: var(--surface-secondary, #0f0f11);
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright, #f4f4f5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }
    .field-group {
      margin-bottom: 12px;
    }
    .field-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted, #888888);
      margin-bottom: 5px;
    }
    .field-group input, .field-group select {
      width: 100%;
      background: var(--surface-bg, #121212);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 4px;
      color: var(--text-bright, #f4f4f5);
      padding: 7px 10px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }
    .svg-viewport {
      background: var(--surface-bg, #121212);
      border-radius: 6px;
      border: 1px solid var(--border-color, #2c2c2c);
      padding: 8px;
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .table-container {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 6px;
    }
    .interfaces-status {
      font-size: 11px;
      color: var(--text-muted, #888888);
      margin: 0 0 8px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .checkbox-row input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .checkbox-row label {
      font-size: 13px;
      color: var(--text-bright, #f4f4f5);
      cursor: pointer;
      margin: 0;
      text-transform: none;
    }
  </style>
</head>
<body class="deep-horizon">
  <div class="window-header">
    <div class="window-title">
      <span class="window-icon">📍</span>
      <span class="window-text">Port & Terminal Buddy</span>
      <span id="block-tag" class="block-tag">PORT BLOCK</span>
    </div>
    <div class="window-actions">
      <button id="btn-open" class="btn-action">📂 Open Model</button>
      <button id="btn-save" class="btn-action btn-primary">💾 Save & Return</button>
      <button id="btn-close" class="btn-action btn-close">✕</button>
    </div>
  </div>

  <div class="split-layout">
    <!-- Properties sidebar -->
    <div class="panel">
      <div class="panel-header">
        <span>Electrical & Port Specifications</span>
      </div>
      <div class="panel-body">
        <div class="field-group">
          <label>Port Identifier</label>
          <input type="text" id="prop-portId" value="MIC_IN_1">
        </div>
        <div class="field-group">
          <label>Port Descriptive Label</label>
          <input type="text" id="prop-label" value="Microphone Preamp 1">
        </div>
        <div class="field-group">
          <label>Physical Connector</label>
          <select id="prop-connector"><!-- config/connectors.json + the Interface Map --></select>
        </div>
        <div class="field-group">
          <label>Signal Direction</label>
          <select id="prop-direction">
            <option value="Input">Input</option>
            <option value="Output">Output</option>
            <option value="Bidirectional">Bidirectional (Tx/Rx)</option>
          </select>
        </div>
        <div class="field-group">
          <label>Signal Format</label>
          <input type="text" id="prop-signalFormat" value="Analog Balanced Audio">
        </div>
        <div class="field-group">
          <label>Nominal Level</label>
          <input type="text" id="prop-level" value="+4 dBu">
        </div>
        <div class="field-group">
          <label>Electrical Impedance</label>
          <input type="text" id="prop-impedance" value="2.4 kΩ (Bridging)">
        </div>
        <div class="field-group">
          <label>PoE Classification</label>
          <select id="prop-poeClass">
            <option value="None">None</option>
            <option value="802.3af (PoE - 15.4W)">802.3af (PoE - 15.4W)</option>
            <option value="802.3at (PoE+ - 30W)">802.3at (PoE+ - 30W)</option>
            <option value="802.3bt (PoE++ - 60W/90W)">802.3bt (PoE++ - 60W/90W)</option>
          </select>
        </div>
        <div class="field-group">
          <label>Optical Wavelength</label>
          <input type="text" id="prop-opticalWavelength" value="N/A">
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="prop-phantomPower" checked>
          <label for="prop-phantomPower">+48V Phantom Power Capable</label>
        </div>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="panel">
      <div class="panel-header">
        <span id="display-port-title">Port Physical Terminal & Pin Map</span>
        <button id="btn-add-pin" class="btn-action btn-small">+ Add Terminal Pin</button>
      </div>
      <div class="panel-body" style="display: flex; flex-direction: column;">
        <div id="connector-svg" class="svg-viewport"></div>

        <div style="font-weight: 600; font-size: 12px; margin-bottom: 8px; color: var(--text-bright);">Connector Pinout & Conductor Color Code</div>
        <div class="table-container">
          <div id="pins-table"></div>
        </div>

        <div style="font-weight: 600; font-size: 12px; margin: 16px 0 8px; color: var(--text-bright);">Real Interfaces (Interface Map)</div>
        <p id="interfaces-status" class="interfaces-status" role="status">Reading the Interface Map…</p>
        <div class="table-container">
          <div id="interfaces-table"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="js/portApp.js"></script>
</body>
</html>
